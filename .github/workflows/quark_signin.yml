name: Quark签到

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # 下载上次保存的签到成功标记
      - name: 下载签到记录
        uses: actions/download-artifact@v4
        with:
          name: sign-record
          path: ./
          continue-on-error: true

      # 判断今天是否已经签到
      - name: 判断是否跳过
        id: check_skip
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "today=$TODAY" >> $GITHUB_ENV

          if [ -f "sign.txt" ]; then
            LAST=$(cat sign.txt)
            echo "last=$LAST" >> $GITHUB_ENV
          else
            LAST=""
          fi

          if [ "$LAST" = "$TODAY" ]; then
            echo "✅ 今天已签到，跳过"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ 今天未签到，执行"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  sign:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 随机延迟
        run: sleep $((RANDOM % 30))

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests

      - name: 运行签到
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
          SCKEY: ${{ secrets.SCKEY }}
        run: python checkIn_Quark.py

      # ✅ 保存今天签到成功（官方 artifact，永久有效）
      - name: 保存签到成功日期
        run: |
          echo $(TZ=Asia/Shanghai date +%Y-%m-%d) > sign.txt

      - name: 上传签到记录
        uses: actions/upload-artifact@v4
        with:
          name: sign-record
          path: sign.txt
          overwrite: true

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@main
        if: always()
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 60
