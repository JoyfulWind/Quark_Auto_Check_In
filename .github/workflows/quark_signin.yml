name: Quark签到

on:
  schedule:
    - cron: '0 1 * * *'   # 固定每天北京时间09:00执行（UTC+8）
  workflow_dispatch:       # 保留手动触发入口

jobs:
  quark-sign-in:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 随机延迟（防风控）
        run: sleep $((RANDOM % 30))  # 0-29秒随机延迟

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          version: 3.x

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到脚本
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
          SCKEY: ${{ secrets.SCKEY }}
        run: python checkIn_Quark.py

      - name: 清理旧运行记录（保持仓库整洁）
        uses: Mattraks/delete-workflow-runs@main
        if: always()
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 60